name: Build and Deploy Student Record Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Create WebAssembly output directory
        run: mkdir -p wasm

      - name: Compile C++ to WebAssembly
        run: |
          em++ src/student_manager.cpp \
            -o wasm/student_manager.js \
            --bind \
            -s MODULARIZE=0 \
            -s EXPORT_ES6=0 \
            -s ENVIRONMENT=web \
            -s ALLOW_MEMORY_GROWTH=1

      - name: Prepare GitHub Pages
        run: touch wasm/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
